<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">Timestep scaling and pressure-solution composition</title><desc id="desc">Measured median timesteps from the CSV are G2: 0.247403 seconds; G3: 1.954467 seconds; G4: 16.613835 seconds. Both scaling axes are logarithmic. G1 is omitted from scaling because it underfills the GPU, but retained in the pressure-fraction chart. Fractions use aggregate measured pressure share; no unprovided momentum subcategories are invented.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#173b8f" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="500" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1600" height="9" rx="0" fill="#173b8f" /><text x="48" y="47" font-size="15" fill="#52657d" font-weight="700" letter-spacing="2">IAC 2026 · ITU ASTRONAUTICAL ENGINEERING</text><text x="48" y="97" font-size="35" fill="#173b8f" font-weight="700" >Timestep cost tracks problem size</text><text x="106" y="143" font-size="23" fill="#152642" font-weight="700" >Median timestep · seconds</text><line x1="106" y1="373" x2="701" y2="373" stroke="#d8e1ed" stroke-width="2" /><text x="91" y="380" font-size="19" fill="#52657d" font-weight="400" text-anchor="end">0.2</text><line x1="106" y1="270" x2="701" y2="270" stroke="#d8e1ed" stroke-width="2" /><text x="91" y="277" font-size="19" fill="#52657d" font-weight="400" text-anchor="end">2</text><line x1="106" y1="167" x2="701" y2="167" stroke="#d8e1ed" stroke-width="2" /><text x="91" y="174" font-size="19" fill="#52657d" font-weight="400" text-anchor="end">20</text><path d="M106.00,363.49 L403.50,270.47 L701.00,177.45" fill="none" stroke="#a84d1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7"/><path d="M106.00,363.49 L