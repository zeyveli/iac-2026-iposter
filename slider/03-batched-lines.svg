ght="700" >Independent compact grid lines</text><line x1="554" y1="255" x2="647" y2="255" stroke="#173b8f" stroke-width="4" marker-end="url(#arrow)"/><rect x="696" y="141" width="377" height="242" rx="18" fill="#eef3fa" /><text x="725" y="180" font-size="21" fill="#173b8f" font-weight="700" >BATCHED LINE SOLVES</text><rect x="726" y="197" width="317" height="23" rx="5" fill="#173b8f" /><text x="742" y="214" font-size="16" fill="#ffffff" font-weight="700" >Line 1  ·  tridiagonal system</text><rect x="726" y="228" width="317" height="23" rx="5" fill="#173b8f" /><text x="742" y="245" font-size="16" fill="#ffffff" font-weight="700" >Line 2  ·  tridiagonal system</text><rect x="726" y="259" width="317" height="23" rx="5" fill="#a84d1c" /><text x="742" y="276" font-size="16" fill="#ffffff" font-weight="700" >Line 3  ·  tridiagonal system</text><rect x="726" y="290" width="317" height="23" rx="5" fill="#173b8f" /><text x="742" y="307" font-size="16" fill="#ffffff" font-weight="700" >Line 4  ·  tridiagonal system</text><rect x="726" y="321" width="317" height="23" rx="5" fill="#173b8f" /><text x="742" y="338" font-size="16" fill="#ffffff" font-weight="700" >Line 5  ·  tridiagonal system</text><text x="1137" y="169" font-size="24" fill="#152642" font-weight="400" >REUSE</text><text x="1137" y="201" font-size="24" fill="#152642" font-weight="400" >Shared left-hand-side</text><text x="1137" y="233" font-size="24" fill="#152642" font-weight="400" >factorization</text><text x="1137" y="287" font-size="24" fill="#152642" font-weight="400" >COALESCE</text><text x="1137" y="319" font-size="24" fill="#152642" font-weight="400" >Memory access without</text><text x="1137" y="351" font-size="24" fill="#152642" font-weight="400" >a main-path transpose</text><line x1="48" y1="433" x2="1552" y2="433" stroke="#d8e1ed" stroke-width="2" /><text x="48" y="472" font-size="20" fill="#52657d" font-weight="400" >GPU parallelism spans independent systems; each compact grid-line solve remains direc