<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">Batched GPU compact line systems</title><desc id="desc">Illustrative independent grid lines map to GPU-batched tridiagonal solves. A common uniform-grid left-hand-side factorization is reused. Coalesced memory layout avoids an explicit transpose on the main execution path. Line counts in this schematic are illustrative, not problem dimensions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#173b8f" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="500" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1600" height="9" rx="0" fill="#173b8f" /><text x="48" y="47" font-size="15" fill="#52657d" font-weight="700" letter-spacing="2">IAC 2026 · ITU ASTRONAUTICAL ENGINEERING</text><text x="48" y="97" font-size="35" fill="#173b8f" font-weight="700" >Many grid lines. One GPU batch.</text><line x1="100" y1="163" x2="505" y2="163" stroke="#173b8f" stroke-width="3" /><circle cx="100" cy="163" r="5" fill="#173b8f" /><circle cx="145" cy="163" r="5" fill="#173b8f" /><circle cx="190" cy="163" r="5" fill="#173b8f" /><circle cx="235" cy="163" r="5" fill="#173b8f" /><circle cx="280" cy="163" r="5" fill="#173b8f" /><circle cx="325" cy="163" r="5" fill="#173b8f" /><circle cx="370" cy="163" r="5" fill="#173b8f" /><circle cx="415" cy="163" r="5" fill="#173b8f" /><circle cx="460" cy="163" r="5" fill="#173b8f" /><circle cx="505" cy="163" r="5" fill="#173b8f" /><line x1="100" y1="206" x2="505" y2="206" stroke="#173b8f" stroke-width="3" /><circle cx="100" cy="206" r="5" fill="#173b8f" /><circle cx="145" cy="206" r="5" fill="#173b8f" /><circle cx="190" cy="206" r="5" fill="#173b8f" /><circle cx="235" cy="206" r="5" fill="#173b8f" /><circle cx="280" cy="206" r="5" fill="#173b8f" /><circle c