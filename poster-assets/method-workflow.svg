<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1260" viewBox="0 0 900 1260" role="img" aria-labelledby="title desc"><title id="title">Sixth-order compact half-staggered GPU method</title><desc id="desc">Six stages form a timestep loop: nodal velocity and cell-centred pressure; AB2 momentum predictor; compact interpolation to faces; matrix-free BiCGSTAB-GMG pressure projection; velocity and pressure correction; return to nodal velocity. Incompressibility is enforced for the corrected face velocities.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#173b8f" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="900" height="1260" rx="0" fill="#ffffff" /><rect x="0" y="0" width="900" height="9" rx="0" fill="#173b8f" /><text x="48" y="47" font-size="15" fill="#52657d" font-weight="700" letter-spacing="2">IAC 2026 · ITU ASTRONAUTICAL ENGINEERING</text><text x="48" y="100" font-size="36" fill="#173b8f" font-weight="700" >High-order accuracy.</text><text x="48" y="146" font-size="36" fill="#173b8f" font-weight="700" >GPU-native execution.</text><text x="48" y="189" font-size="26" fill="#52657d" font-weight="400" >A half-staggered projection timestep</text><rect x="94" y="235" width="708" height="108" rx="18" fill="#eef3fa" /><circle cx="130" cy="272" r="20" fill="#173b8f" /><text x="130" y="280" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="165" y="277" font-size="27" fill="#173b8f" font-weight="700" >Nodal velocity</text><text x="165" y="314" font-size="22" fill="#52657d" font-weight="400" >Cell-centred pressure</text><line x1="448" y1="347" x2="448" y2="366" stroke="#173b8f" stroke-width="3" marker-end="url(#arrow)"/><rect x="94" y="372" width="708" height="108" rx="18" fill="#eef3fa" /><circle cx="130" cy="409" r="20" fill="#173b8f" /><text x="130" y="417" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="165" y="414" font-size="27" fill="#173b8f" font-weight="700" >AB2 momentum predictor</text><text x="165" y="451" font-size="22" fill="#52657d" font-weight="400" >Advance the nodal velocity</text><line x1="448" y1="484" x2="448" y2="503" stroke="#173b8f" stroke-width="3" marker-end="url(#arrow)"/><rect x="94" y="509" width="708" height="108" rx="18" fill="#eef3fa" /><circle cx="130" cy="546" r="20" fill="#173b8f" /><text x="130" y="554" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="165" y="551" font-size="27" fill="#173b8f" font-weight="700" >Compact interpolation</text><text x="165" y="588" font-size="22" fill="#52657d" font-weight="400" >Transfer velocity to faces</text><line x1="448" y1="621" x2="448" y2="640" stroke="#173b8f" stroke-width="3" marker-end="url(#arrow)"/><rect x="94" y="646" width="708" height="108" rx="18" fill="#173b8f" /><circle cx="130" cy="683" r="20" fill="#ffffff" /><text x="130" y="691" font-size="22" fill="#173b8f" font-weight="700" text-anchor="middle">4</text><text x="165" y="688" font-size="27" fill="#ffffff" font-weight="700" >Matrix-free pressure projection</text><text x="165" y="725" font-size="22" fill="#ffffff" font-weight="400" >BiCGSTAB + geometric multigrid</text><line x1="448" y1="758" x2="448" y2="777" stroke="#173b8f" stroke-width="3" marker-end="url(#arrow)"/><rect x="94" y="783" width="708" height="108" rx="18" fill="#eef3fa" /><circle cx="130" cy="820" r="20" fill="#173b8f" /><text x="130" y="828" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="165" y="825" font-size="27" fill="#173b8f" font-weight="700" >Velocity + pressure correction</text><text x="165" y="862" font-size="22" fill="#52657d" font-weight="400" >Enforce face-velocity incompressibility</text><line x1="448" y1="895" x2="448" y2="914" stroke="#173b8f" stroke-width="3" marker-end="url(#arrow)"/><rect x="94" y="920" width="708" height="108" rx="18" fill="#eef3fa" /><circle cx="130" cy="957" r="20" fill="#173b8f" /><text x="130" y="965" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">6</text><text x="165" y="962" font-size="27" fill="#173b8f" font-weight="700" >Return to nodal velocity</text><text x="165" y="999" font-size="22" fill="#52657d" font-weight="400" >Ready for the next timestep</text><path d="M802 974 H842 V290 H811" fill="none" stroke="#173b8f" stroke-width="3" marker-end="url(#arrow)"/><rect x="94" y="1090" width="708" height="89" rx="18" fill="#f9d0e4" /><text x="448" y="1127" font-size="27" fill="#f45c8b" font-weight="700" text-anchor="middle">Sixth-order compact operators</text><text x="448" y="1161" font-size="23" fill="#152642" font-weight="400" text-anchor="middle">Batched line systems · entirely on the GPU</text></g></svg>