<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc"><title id="title">Half-staggered arrangement and projection locations</title><desc id="desc">Schematic, not a flow-field visualization. Blue circles indicate nodal velocity storage; warm squares cell-centred pressure; teal marks face-normal operator locations. Momentum prediction is nodal, while divergence and pressure correction use staggered faces.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#173b8f" stroke-width="1.5"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1600" height="500" rx="0" fill="#ffffff" /><rect x="0" y="0" width="1600" height="9" rx="0" fill="#173b8f" /><text x="48" y="47" font-size="15" fill="#52657d" font-weight="700" letter-spacing="2">IAC 2026 · ITU ASTRONAUTICAL ENGINEERING</text><text x="48" y="97" font-size="35" fill="#173b8f" font-weight="700" >Half-staggered projection</text><line x1="100" y1="158" x2="100" y2="380" stroke="#d8e1ed" stroke-width="2" /><line x1="174" y1="158" x2="174" y2="380" stroke="#d8e1ed" stroke-width="2" /><line x1="248" y1="158" x2="248" y2="380" stroke="#d8e1ed" stroke-width="2" /><line x1="322" y1="158" x2="322" y2="380" stroke="#d8e1ed" stroke-width="2" /><line x1="396" y1="158" x2="396" y2="380" stroke="#d8e1ed" stroke-width="2" /><line x1="470" y1="158" x2="470" y2="380" stroke="#d8e1ed" stroke-width="2" /><line x1="100" y1="158" x2="470" y2="158" stroke="#d8e1ed" stroke-width="2" /><line x1="100" y1="232" x2="470" y2="232" stroke="#d8e1ed" stroke-width="2" /><line x1="100" y1="306" x2="470" y2="306" stroke="#d8e1ed" stroke-width="2" /><line x1="100" y1="380" x2="470" y2="380" stroke="#d8e1ed" stroke-width="2" /><circle cx="100" cy="158" r="5" fill="#173b8f" /><circle cx="100" cy="232" r="5" fill="#173b8f" /><circle cx="100" cy="306" r="5" fill="#173b8f" /><circle cx="100" cy="380" r="5" fill="#173b8f" /><circle cx="174" cy="158" r="5" fill="#173b8f" /><circle cx="174" cy="232" r="5" fill="#173b8f" /><circle cx="174" cy="306" r="5" fill="#173b8f" /><circle cx="174" cy="380" r="5" fill="#173b8f" /><circle cx="248" cy="158" r="5" fill="#173b8f" /><circle cx="248" cy="232" r="5" fill="#173b8f" /><circle cx="248" cy="306" r="5" fill="#173b8f" /><circle cx="248" cy="380" r="5" fill="#173b8f" /><circle cx="322" cy="158" r="5" fill="#173b8f" /><circle cx="322" cy="232" r="5" fill="#173b8f" /><circle cx="322" cy="306" r="5" fill="#173b8f" /><circle cx="322" cy="380" r="5" fill="#173b8f" /><circle cx="396" cy="158" r="5" fill="#173b8f" /><circle cx="396" cy="232" r="5" fill="#173b8f" /><circle cx="396" cy="306" r="5" fill="#173b8f" /><circle cx="396" cy="380" r="5" fill="#173b8f" /><circle cx="470" cy="158" r="5" fill="#173b8f" /><circle cx="470" cy="232" r="5" fill="#173b8f" /><circle cx="470" cy="306" r="5" fill="#173b8f" /><circle cx="470" cy="380" r="5" fill="#173b8f" /><rect x="131" y="189" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="131" y="263" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="131" y="337" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="205" y="189" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="205" y="263" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="205" y="337" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="279" y="189" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="279" y="263" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="279" y="337" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="353" y="189" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="353" y="263" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="353" y="337" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="427" y="189" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="427" y="263" width="12" height="12" rx="1" fill="#f45c8b" /><rect x="427" y="337" width="12" height="12" rx="1" fill="#f45c8b" /><line x1="162" y1="195" x2="186" y2="195" stroke="#367e86" stroke-width="3" /><line x1="162" y1="269" x2="186" y2="269" stroke="#367e86" stroke-width="3" /><line x1="162" y1="343" x2="186" y2="343" stroke="#367e86" stroke-width="3" /><line x1="236" y1="195" x2="260" y2="195" stroke="#367e86" stroke-width="3" /><line x1="236" y1="269" x2="260" y2="269" stroke="#367e86" stroke-width="3" /><line x1="236" y1="343" x2="260" y2="343" stroke="#367e86" stroke-width="3" /><line x1="310" y1="195" x2="334" y2="195" stroke="#367e86" stroke-width="3" /><line x1="310" y1="269" x2="334" y2="269" stroke="#367e86" stroke-width="3" /><line x1="310" y1="343" x2="334" y2="343" stroke="#367e86" stroke-width="3" /><line x1="384" y1="195" x2="408" y2="195" stroke="#367e86" stroke-width="3" /><line x1="384" y1="269" x2="408" y2="269" stroke="#367e86" stroke-width="3" /><line x1="384" y1="343" x2="408" y2="343" stroke="#367e86" stroke-width="3" /><line x1="137" y1="220" x2="137" y2="244" stroke="#367e86" stroke-width="3" /><line x1="137" y1="294" x2="137" y2="318" stroke="#367e86" stroke-width="3" /><line x1="211" y1="220" x2="211" y2="244" stroke="#367e86" stroke-width="3" /><line x1="211" y1="294" x2="211" y2="318" stroke="#367e86" stroke-width="3" /><line x1="285" y1="220" x2="285" y2="244" stroke="#367e86" stroke-width="3" /><line x1="285" y1="294" x2="285" y2="318" stroke="#367e86" stroke-width="3" /><line x1="359" y1="220" x2="359" y2="244" stroke="#367e86" stroke-width="3" /><line x1="359" y1="294" x2="359" y2="318" stroke="#367e86" stroke-width="3" /><line x1="433" y1="220" x2="433" y2="244" stroke="#367e86" stroke-width="3" /><line x1="433" y1="294" x2="433" y2="318" stroke="#367e86" stroke-width="3" /><circle cx="555" cy="165" r="7" fill="#173b8f" /><text x="576" y="173" font-size="25" fill="#173b8f" font-weight="700" >Nodal velocity</text><rect x="548" y="210" width="14" height="14" rx="1" fill="#f45c8b" /><text x="576" y="225" font-size="25" fill="#f45c8b" font-weight="700" >Cell-centred pressure</text><line x1="544" y1="268" x2="566" y2="268" stroke="#367e86" stroke-width="4" /><text x="576" y="276" font-size="25" fill="#367e86" font-weight="700" >Face-normal operators</text><text x="548" y="330" font-size="27" fill="#152642" font-weight="700" >Momentum at nodes.</text><text x="548" y="368" font-size="27" fill="#152642" font-weight="700" >Projection at faces.</text><rect x="997" y="130" width="555" height="273" rx="18" fill="#eef3fa" /><text x="1028" y="172" font-size="22" fill="#173b8f" font-weight="700" >PREDICT → PROJECT → CORRECT</text><text x="1028" y="223" font-size="25" fill="#152642" font-weight="400" >AB2 predictor</text><text x="1028" y="268" font-size="25" fill="#152642" font-weight="400" >Compact interpolation to faces</text><text x="1028" y="313" font-size="25" fill="#152642" font-weight="400" >Matrix-free DₕGₕ pressure solve</text><text x="1028" y="358" font-size="25" fill="#152642" font-weight="400" >Face correction → nodal return</text><line x1="48" y1="433" x2="1552" y2="433" stroke="#d8e1ed" stroke-width="2" /><text x="48" y="472" font-size="20" fill="#52657d" font-weight="400" >Incompressibility is enforced on corrected staggered face velocities—not claimed for interpolated nodal velocity.</text></g></svg>